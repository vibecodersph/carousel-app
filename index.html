<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinetic Image Cover</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="kinetic-stage" aria-label="Kinetic editorial cover">
        <article class="cover-frame" style="--mx: 0; --my: 0;">
          <div class="paper-field" aria-hidden="true"></div>

          <div class="image-world" aria-hidden="true">
            <div class="art-plane art-plane-main"></div>
            <div class="art-plane art-plane-ghost art-plane-ghost-one"></div>
            <div class="art-plane art-plane-ghost art-plane-ghost-two"></div>

            <div class="slice-stack">
              <span class="image-slice slice-one"></span>
              <span class="image-slice slice-two"></span>
              <span class="image-slice slice-three"></span>
              <span class="image-slice slice-four"></span>
            </div>

            <div class="orbit-system">
              <span class="orbit-line orbit-line-one"></span>
              <span class="orbit-line orbit-line-two"></span>
              <span class="orbit-crop orbit-crop-one"></span>
              <span class="orbit-crop orbit-crop-two"></span>
              <span class="orbit-crop orbit-crop-three"></span>
            </div>

            <div class="hinge-deck">
              <span class="hinge-page page-one"></span>
              <span class="hinge-page page-two"></span>
              <span class="hinge-page page-three"></span>
            </div>
          </div>

          <div class="type-field">
            <div class="kicker-row">
              <span>Bagong GPT</span>
              <span>OpenAI preview</span>
            </div>

            <h1>
              <span>Bakit biglang</span>
              <span>hinati sa tatlo</span>
              <span>ang bagong GPT-5.6?</span>
            </h1>

            <p>Swipe para makita ang tatlong tier</p>
          </div>

          <div class="kinetic-words" aria-hidden="true">
            <span class="word word-one">SOL</span>
            <span class="word word-two">TERRA</span>
            <span class="word word-three">LUNA</span>
            <span class="word word-four">THREE</span>
            <span class="word word-five">TIERS</span>
          </div>

          <div class="edge-caption" aria-hidden="true">VIBECODERS PH / IMAGE BRIEF</div>
        </article>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
